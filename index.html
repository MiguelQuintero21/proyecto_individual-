<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas Web</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- CSS Gótico Morado Personalizado -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container py-4">
    <!-- Encabezado principal -->
    <header class="text-center mb-4">
      <h1 class="display-3">PLANIFICADOR DE TAREAS</h1>
      <p class="text-muted small">Organiza tus pesadillas y actividades diarias 🕷️ 🦇</p>
    </header>

    <div class="row g-4">
      <!-- Columna Formulario (Nueva Tarea) -->
      <div class="col-lg-4">
        <div class="card p-3">
          <h4 class="title-gothic mb-3">Nueva Tarea</h4>
          <form id="task-form">
            <div class="mb-3">
              <label for="task-name" class="form-label">Título de la tarea</label>
              <input type="text" class="form-control" id="task-name" placeholder="Ej: Wireframe Figma">
            </div>
            <div class="mb-3">
              <label for="task-desc" class="form-label">Descripción</label>
              <textarea class="form-control" id="task-desc" rows="3" placeholder="Descripción de la tarea..."></textarea>
            </div>
            <div class="mb-3">
              <label for="task-date" class="form-label">Fecha de entrega</label>
              <input type="date" class="form-control" id="task-date">
            </div>
            <div class="mb-3">
              <label for="task-status" class="form-label">Estado</label>
              <select class="form-select" id="task-status">
                <option value="">Selecciona un estado</option>
                <option value="PENDIENTE">PENDIENTE</option>
                <option value="EN PROCESO">EN PROCESO</option>
              </select>
            </div>
            <button type="submit" class="btn btn-gothic-purple w-100 py-2">GUARDAR TAREA 👻</button>
          </form>
        </div>
      </div>

      <!-- Columna Lista de Tareas -->
      <div class="col-lg-8">
        <div class="card p-3 mb-4">
          <h4 class="title-gothic mb-3">Tareas Pendientes</h4>
          
          <!-- Tarea de ejemplo 1 -->
          <div class="card p-3 mb-2" style="background-color: #1a102b !important; border-color: #3b1d6e !important;">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h5 class="m-0 fw-bold text-light">Wireframe Figma</h5>
                <small class="text-muted">Crear el diseño de baja fidelidad en Figma.</small>
                <div class="mt-1">
                  <span class="badge" style="background-color: #4c2882; color: #d8b4fe;">2026-11-05</span>
                </div>
              </div>
              <div>
                <input type="checkbox" class="form-check-input me-2" style="background-color: #140d21; border-color: #a855f7;">
                <button class="btn btn-outline-danger btn-sm">✕</button>
              </div>
            </div>
          </div>

          <!-- Tarea de ejemplo 2 -->
          <div class="card p-3 mb-2" style="background-color: #1a102b !important; border-color: #3b1d6e !important;">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h5 class="m-0 fw-bold text-light">Estructura HTML</h5>
                <small class="text-muted">Crear las secciones principales</small>
                <div class="mt-1">
                  <span class="badge" style="background-color: #4c2882; color: #d8b4fe;">2026-11-04</span>
                </div>
              </div>
              <div>
                <input type="checkbox" class="form-check-input me-2" checked style="background-color: #140d21; border-color: #a855f7;">
                <button class="btn btn-outline-danger btn-sm">✕</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts en orden estricto de la Tarea 4 -->
  <script src="js/taskManager.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
