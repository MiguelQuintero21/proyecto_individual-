
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas Web</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Encabezado -->
    <header class="text-center py-4 mb-4">
        <h1>Planificador de Tareas</h1>
        <p class="lead text-muted mb-0">Organiza tus pesadillas y actividades diarias</p>
    </header>

    <main class="container">
        <div class="row">
            <!-- Formulario para agregar tareas -->
            <section class="col-md-4 mb-4">
                <div class="card shadow-sm p-3">
                    <h3 class="mb-3">Nueva Tarea</h3>
                    <form id="taskForm">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Título de la tarea</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Descripción</label>
                            <textarea class="form-control" id="taskDescription" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Tarea 🕷️</button>
                    </form>
                </div>
            </section>

            <!-- Lista de Tareas -->
            <section class="col-md-8">
                <h3>Tareas Pendientes</h3>
                <div id="taskList" class="row g-3">
                    <div class="col-12 text-muted">No hay tareas registradas todavía.</div>
                </div>
            </section>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
